[project]
name = "flythings"
version = "2.2.8"
authors = [{ name = "flythings", email = "fly@itg.es" }]
description = "A python library to add and search observations into flythings"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["flythings", "IoT"]
requires-python = ">=3.10"
dependencies = ["requests>=2.32.3"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: System :: Networking :: Monitoring",
]

[project.urls]
Homepage = "http://flythings.io"
Repository = "https://github.com/flythings/python"
Changelog = "https://github.com/flythings/python/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "docs",
  "examples",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
]

[dependency-groups]
dev = ["pytest>=8.3.4", "pytest-cov>=6.0.0", "ruff>=0.15.9"]

# Tools configuration

# Ruff
[tool.ruff]
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  "bin",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
]
line-length = 120
indent-width = 4
target-version = "py310"

[tool.ruff.lint]

ignore = [
  # No docstrings
  "D",
  # Args and kwargs
  "ANN002",
  "ANN003",
  #__init__
  "ANN204",
  #Any
  "ANN401",
  #TODOs
  "TD003",
  #
  "FBT001",
  "FBT002",
  "FBT003",
  "PGH003",
  "ERA001",
  "COM812",
  "COM819",
  "D100",
  "D203",
  "D213",
  "D300",
  "E111",
  "E114",
  "E117",
  "ISC001",
  "ISC002",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "W191",
  # No copyright headers in this project
  "CPY001",
]
select = ["ALL"]

fixable = ["ALL"]
unfixable = []
extend-safe-fixes = ["TC"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"


[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "D",
  "INP001",
  "S101",
  "ANN001",
  "ANN201",
  "ARG001",
  "ARG002",
  "SLF001",
  "PLR2004",
  "S105",
  "S106",
]
"*_test.py" = [
  "D",
  "INP001",
  "S101",
  "ANN001",
  "ANN201",
  "ARG001",
  "ARG002",
  "SLF001",
  "PLR2004",
  "S105",
  "S106",
]
"examples/**" = ["INP001", "T201", "S311", "PLR2004"]
"scripts/**" = ["INP001", "T201", "S310", "PLR2004"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
suppress-none-returning = true

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true


# Commitizen
[tool.commitizen]
name = "cz_conventional_commits"
# Existing release tags have no "v" prefix (2.2.8, 2.2.7, ...)
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
retry_after_failure = true
update_changelog_on_bump = false
changelog_incremental = true
changelog_merge_prerelease = true
pre_bump_hooks = ["uv lock"]

# Only the following are shown in the changelog:
# "Feat","Fix", "Refactor","Perf"


#Pytest
[tool.pytest.ini_options]
addopts = """
    --cov=src
    --cov-branch
    --cov-fail-under=75
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --import-mode=importlib
"""
norecursedirs = [".*", "__pycache__", "htmlcov"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ['^if TYPE_CHECKING:', 'pragma: no cover']


# Tox
[tool.tox]
requires = ["tox>=4.19"]
env_list = ["3.14", "3.13", "3.12", "3.11", "3.10"]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
description = "Run test under {base_python}"
commands = [["pytest", "--no-cov"]]


#Pyright
[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "All"
venv = ".venv"
typeCheckingMode = "standard"
include = ["src", "tests"]
exclude = [
  "**/.*",
  "**/__pycache__",
  "bin",
  ".pytest_cache",
  ".ruff_cache",
  ".task",
  ".tox",
  ".venv",
  "venv",
  "~/.vscode",
  ".vscode",
  ".idea",
  "dist",
  "build",
  "node_modules",
  "site-packages",
]
reportAny = false
reportExplicitAny = false

executionEnvironments = [
  { root = "tests", reportArgumentType = false, reportAttributeAccessIssue = false, reportCallIssue = false },
]

[tool.pyright.analysis]
diagnosticMode = "workspace"

# Pyrefly header
[tool.pyrefly]

#### project structure
project-includes = ["src/**", "tests/**"]

project-excludes = [
  "**/.*",
  "**/__pycache__",
  "bin",
  ".pytest_cache",
  ".ruff_cache",
  ".task",
  ".tox",
  ".venv",
  "venv",
  "dist",
  "build",
  "node_modules",
  "site-packages",
]

search-path = ["src"]
permissive-ignores = true

#### python environment
python-version = "3.11"
python-platform = "linux"
python-interpreter-path = ".venv/bin/python3"

#### type checking preset (closest to Pyright "standard")
preset = "default"
infer-with-first-use = false
min-severity = "warn"

#### global error settings
[tool.pyrefly.errors]
# overrides
unknown-column = "error"

############################################################
# Tests-specific configuration (Pyright executionEnvironments)
############################################################

[[tool.pyrefly.sub-config]]
matches = "tests/**"

# Pyright equivalents:
# reportArgumentType = false
# reportAttributeAccessIssue = false
# reportCallIssue = false
#
# Pyrefly does not use those names; instead, errors are grouped.
# We disable relevant categories at the sub-config level:

[tool.pyrefly.sub-config.errors]
invalid-argument = false
bad-assignment = false
bad-index = false
missing-attribute = false
bad-argument-type = false
bad-typed-dict-key = false
unsupported-operation = false
